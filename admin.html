<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mala Devi Gurukul - Admin Panel</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0d1117;
    color:#c9d1d9;
}

header{
    background:#161b22;
    padding:18px;
    border-bottom:1px solid #30363d;
    text-align:center;
}

header h1{
    margin:0;
    color:#ffbf00;
    font-size:22px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.class-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.class-buttons button{
    flex:1;
    min-width:100px;
    padding:12px;
    border:1px solid #30363d;
    border-radius:8px;
    background:#161b22;
    color:#c9d1d9;
    cursor:pointer;
}

.class-buttons button.active{
    background:#ffbf00;
    color:#000;
    font-weight:bold;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

h2{
    color:#ffbf00;
    margin:0;
}

button{
    cursor:pointer;
}

.add-btn{
    background:#ffbf00;
    border:0;
    padding:10px 14px;
    border-radius:7px;
    font-weight:bold;
}

.subject{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:10px;
    margin-bottom:15px;
    overflow:hidden;
}

.subject-head{
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #30363d;
}

.subject-name{
    font-size:18px;
    font-weight:bold;
    color:#fff;
}

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.actions button{
    padding:7px 9px;
    border:1px solid #30363d;
    background:#0d1117;
    color:#c9d1d9;
    border-radius:6px;
}

.actions .danger{
    color:#ff6b6b;
}

.chapter{
    padding:13px 15px;
    border-bottom:1px solid #21262d;
}

.chapter:last-child{
    border-bottom:0;
}

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.chapter-name{
    color:#fff;
}

.status{
    font-size:12px;
    padding:4px 7px;
    border-radius:5px;
    background:#238636;
    color:white;
}

.status.hidden{
    background:#6e7681;
}

.empty{
    padding:30px;
    text-align:center;
    color:#8b949e;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:1000;
    padding:20px;
    overflow:auto;
}

.modal-box{
    max-width:600px;
    margin:30px auto;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:12px;
    padding:20px;
}

.modal-box h3{
    color:#ffbf00;
    margin-top:0;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:5px;
}

input, select{
    width:100%;
    padding:11px;
    border-radius:7px;
    border:1px solid #30363d;
    background:#0d1117;
    color:#fff;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-buttons button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:7px;
}

.save-btn{
    background:#ffbf00;
    color:#000;
    font-weight:bold;
}

.cancel-btn{
    background:#30363d;
    color:#fff;
}

.loading{
    text-align:center;
    padding:30px;
    color:#ffbf00;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .topbar{
        align-items:flex-start;
    }

    .subject-head{
        align-items:flex-start;
        flex-direction:column;
    }

    .chapter-row{
        align-items:flex-start;
        flex-direction:column;
    }

    .actions{
        width:100%;
    }

}

</style>
</head>

<body>

<header>
    <h1>📚 Mala Devi Gurukul — Admin Panel</h1>
</header>

<div class="container">

    <div class="class-buttons">

        <button
            onclick="selectClass('6-8')"
            id="btn-6-8">
            Class 6–8
        </button>

        <button
            onclick="selectClass('9-10')"
            id="btn-9-10">
            Class 9–10
        </button>

        <button
            onclick="selectClass('11-12')"
            id="btn-11-12">
            Class 11–12
        </button>

    </div>

    <div class="topbar">

        <h2 id="classTitle">
            Class 6–8
        </h2>

        <button
            class="add-btn"
            onclick="openSubjectModal()">
            + नया विषय
        </button>

    </div>

    <div id="content">

        <div class="loading">
            Data लोड हो रहा है...
        </div>

    </div>

</div>


<!-- SUBJECT MODAL -->

<div class="modal" id="subjectModal">

    <div class="modal-box">

        <h3 id="subjectModalTitle">
            नया विषय
        </h3>

        <label>
            विषय का नाम
        </label>

        <input
            type="text"
            id="subjectName"
            placeholder="जैसे Mathematics"
        >

        <div class="modal-buttons">

            <button
                class="cancel-btn"
                onclick="closeSubjectModal()">
                Cancel
            </button>

            <button
                class="save-btn"
                onclick="saveSubject()">
                Save
            </button>

        </div>

    </div>

</div>


<!-- CHAPTER MODAL -->

<div class="modal" id="chapterModal">

    <div class="modal-box">

        <h3 id="chapterModalTitle">
            नया अध्याय
        </h3>

        <label>
            अध्याय का नाम
        </label>

        <input
            type="text"
            id="chapterName"
            placeholder="जैसे वास्तविक संख्याएँ"
        >

        <label>
            Teacher का नाम
        </label>

        <input
            type="text"
            id="teacherName"
            placeholder="Teacher का नाम"
        >

        <label>
            YouTube Lecture Link
        </label>

        <input
            type="url"
            id="videoLink"
            placeholder="https://youtube.com/watch?v=..."
        >

        <label>
            Notes Link
        </label>

        <input
            type="url"
            id="notesLink"
            placeholder="Notes का link"
        >

        <label>
            Questions / Practice Link
        </label>

        <input
            type="url"
            id="questionsLink"
            placeholder="Practice questions link"
        >

        <label>
            Test Link
        </label>

        <input
            type="url"
            id="testLink"
            placeholder="Test link"
        >

        <div class="modal-buttons">

            <button
                class="cancel-btn"
                onclick="closeChapterModal()">
                Cancel
            </button>

            <button
                class="save-btn"
                onclick="saveChapter()">
                Save
            </button>

        </div>

    </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzHLheN3Pirer7F6F9XstSt4qC7i9tBp1zl2ZUS5pg8doy_XzYmYMClfukulCOtye_bAw/exec";


let allData = [];

let selectedClass = "6-8";

let editingSubject = null;

let editingChapter = null;

let currentSubject = null;


/* =====================================================
   CLASS SAFE STORAGE
   Google Sheets में 6-8 को date बनने से रोकता है
===================================================== */

function classToStorage(className){

    const map = {

        "6-8": "CLASS_6_8",

        "9-10": "CLASS_9_10",

        "11-12": "CLASS_11_12"

    };

    return map[className] || className;

}


function classFromStorage(value){

    const map = {

        "CLASS_6_8": "6-8",

        "CLASS_9_10": "9-10",

        "CLASS_11_12": "11-12"

    };

    return map[String(value)] || String(value);

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

    try{

        document.getElementById("content").innerHTML =
        `<div class="loading">
            Data लोड हो रहा है...
        </div>`;


        const response =
        await fetch(
            API_URL,
            {
                cache:"no-store"
            }
        );


        const result =
        await response.json();


        if(!result.success){

            throw new Error(
                result.message
            );

        }


        /*
         API से आने वाले Class codes को
         वापस normal Class में बदलना
        */

        allData =
        (result.data || []).map(item => {

            return {

                ...item,

                Class:
                classFromStorage(item.Class)

            };

        });


        render();


    }catch(error){

        console.error(error);


        document.getElementById("content").innerHTML =

        `<div class="empty">

            ❌ Data load नहीं हो पाया।

            <br><br>

            ${escapeHtml(error.message)}

        </div>`;

    }

}


/* =====================================================
   CLASS SELECT
===================================================== */

function selectClass(className){

    selectedClass = className;


    document
    .querySelectorAll(".class-buttons button")
    .forEach(btn =>
        btn.classList.remove("active")
    );


    document
    .getElementById(
        "btn-" + className
    )
    .classList.add("active");


    document.getElementById(
        "classTitle"
    ).innerText =
    "Class " + className;


    render();

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    const container =
    document.getElementById("content");


    const classData =
    allData.filter(item =>

        String(item.Class) ===
        String(selectedClass)

    );


    if(classData.length === 0){

        container.innerHTML =

        `<div class="empty">

            अभी इस class में कोई subject नहीं है।

        </div>`;

        return;

    }


    const subjects = {};


    classData.forEach(item => {

        const subject =
        item.Subject || "Unknown";


        if(!subjects[subject]){

            subjects[subject] = [];

        }


        subjects[subject].push(item);

    });


    let html = "";


    Object.keys(subjects).forEach(subject => {

        const chapters =
        subjects[subject];


        html += `

        <div class="subject">

            <div class="subject-head">

                <div class="subject-name">

                    📘 ${escapeHtml(subject)}

                </div>

                <div class="actions">

                    <button
                    onclick="addChapter('${escapeAttr(subject)}')">

                        + अध्याय

                    </button>


                    <button
                    onclick="editSubject('${escapeAttr(subject)}')">

                        ✏️ Edit

                    </button>


                    <button
                    class="danger"
                    onclick="deleteSubject('${escapeAttr(subject)}')">

                        🗑️ Delete

                    </button>

                </div>

            </div>

        `;


        chapters.forEach(chapter => {

            const hidden =
            String(chapter.Status).toLowerCase()
            === "hidden";


            html += `

            <div class="chapter">

                <div class="chapter-row">

                    <div>

                        <div class="chapter-name">

                            📖
                            ${escapeHtml(
                                chapter.Chapter
                            )}

                        </div>


                        ${
                            chapter.Teacher

                            ?

                            `<small>
                                Teacher:
                                ${escapeHtml(
                                    chapter.Teacher
                                )}
                            </small>`

                            :

                            ""
                        }

                    </div>


                    <div class="actions">

                        <span
                        class="status ${hidden ? "hidden" : ""}">

                            ${
                                hidden
                                ?
                                "Hidden"
                                :
                                "Published"
                            }

                        </span>


                        <button
                        onclick="editChapter('${escapeAttr(chapter.ID)}')">

                            ✏️

                        </button>


                        <button
                        onclick="toggleStatus('${escapeAttr(chapter.ID)}')">

                            ${
                                hidden
                                ?
                                "👁️"
                                :
                                "🙈"
                            }

                        </button>


                        <button
                        class="danger"
                        onclick="deleteChapter('${escapeAttr(chapter.ID)}')">

                            🗑️

                        </button>

                    </div>

                </div>

            </div>

            `;

        });


        html += `</div>`;

    });


    container.innerHTML = html;

}


/* =====================================================
   SUBJECT MODAL
===================================================== */

function openSubjectModal(){

    editingSubject = null;


    document.getElementById(
        "subjectModalTitle"
    ).innerText =
    "नया विषय";


    document.getElementById(
        "subjectName"
    ).value = "";


    document.getElementById(
        "subjectModal"
    ).style.display =
    "block";

}


function closeSubjectModal(){

    document.getElementById(
        "subjectModal"
    ).style.display =
    "none";

}


/* =====================================================
   SAVE SUBJECT
===================================================== */

function saveSubject(){

    const name =
    document.getElementById(
        "subjectName"
    ).value.trim();


    if(!name){

        alert(
            "विषय का नाम लिखिए।"
        );

        return;

    }


    if(editingSubject){

        const oldName =
        editingSubject;


        const chapters =
        allData.filter(item =>

            String(item.Class)
            ===
            String(selectedClass)

            &&

            String(item.Subject)
            ===
            String(oldName)

        );


        if(chapters.length === 0){

            alert(
                "Subject में कोई chapter नहीं मिला।"
            );

            return;

        }


        updateSubjectChapters(
            chapters,
            name
        );


    }else{

        /*
         Subject अपने आप database में
         row नहीं बनाता।
         पहला chapter जोड़कर Subject बनेगा।
        */

        closeSubjectModal();

        addChapter(name);

    }

}


/* =====================================================
   UPDATE SUBJECT
===================================================== */

async function updateSubjectChapters(
    chapters,
    newName
){

    closeSubjectModal();


    for(const item of chapters){

        item.Subject =
        newName;


        /*
         Safe Class code भेजें
        */

        item.Class =
        classToStorage(
            classFromStorage(
                item.Class
            )
        );


        await apiRequest(
            "update",
            item
        );

    }


    await loadData();

}


/* =====================================================
   EDIT SUBJECT
===================================================== */

function editSubject(subject){

    editingSubject =
    subject;


    document.getElementById(
        "subjectModalTitle"
    ).innerText =
    "विषय Edit करें";


    document.getElementById(
        "subjectName"
    ).value =
    subject;


    document.getElementById(
        "subjectModal"
    ).style.display =
    "block";

}


/* =====================================================
   DELETE SUBJECT
===================================================== */

async function deleteSubject(subject){

    const chapters =
    allData.filter(item =>

        String(item.Class)
        ===
        String(selectedClass)

        &&

        String(item.Subject)
        ===
        String(subject)

    );


    if(!chapters.length){

        return;

    }


    if(!confirm(

        `"${subject}" और उसके सभी chapters delete करें?`

    )){

        return;

    }


    for(const item of chapters){

        await apiRequest(

            "delete",

            {
                ID:item.ID
            }

        );

    }


    await loadData();

}


/* =====================================================
   ADD CHAPTER
===================================================== */

function addChapter(subject){

    currentSubject =
    subject;


    editingChapter =
    null;


    document.getElementById(
        "chapterModalTitle"
    ).innerText =
    "नया अध्याय — " + subject;


    document.getElementById(
        "chapterName"
    ).value = "";


    document.getElementById(
        "teacherName"
    ).value = "";


    document.getElementById(
        "videoLink"
    ).value = "";


    document.getElementById(
        "notesLink"
    ).value = "";


    document.getElementById(
        "questionsLink"
    ).value = "";


    document.getElementById(
        "testLink"
    ).value = "";


    document.getElementById(
        "chapterModal"
    ).style.display =
    "block";

}


/* =====================================================
   EDIT CHAPTER
===================================================== */

function editChapter(id){

    const item =
    allData.find(x =>

        String(x.ID)
        ===
        String(id)

    );


    if(!item){

        return;

    }


    editingChapter =
    item;


    /*
     Class को हमेशा normal format में रखें
    */

    item.Class =
    classFromStorage(
        item.Class
    );


    currentSubject =
    item.Subject;


    document.getElementById(
        "chapterModalTitle"
    ).innerText =
    "अध्याय Edit करें";


    document.getElementById(
        "chapterName"
    ).value =
    item.Chapter || "";


    document.getElementById(
        "teacherName"
    ).value =
    item.Teacher || "";


    document.getElementById(
        "videoLink"
    ).value =
    item.Video || "";


    document.getElementById(
        "notesLink"
    ).value =
    item.Notes || "";


    document.getElementById(
        "questionsLink"
    ).value =
    item.Questions || "";


    document.getElementById(
        "testLink"
    ).value =
    item.Test || "";


    document.getElementById(
        "chapterModal"
    ).style.display =
    "block";

}


/* =====================================================
   CLOSE CHAPTER MODAL
===================================================== */

function closeChapterModal(){

    document.getElementById(
        "chapterModal"
    ).style.display =
    "none";

}


/* =====================================================
   SAVE CHAPTER
===================================================== */

async function saveChapter(){

    const chapter =
    document.getElementById(
        "chapterName"
    ).value.trim();


    if(!chapter){

        alert(
            "अध्याय का नाम लिखिए।"
        );

        return;

    }


    /*
     IMPORTANT:
     Class को safe storage code में बदलना
    */

    const safeClass =
    classToStorage(
        selectedClass
    );


    const item = {

        ID:

        editingChapter

        ?

        editingChapter.ID

        :

        "",


        Class:

        safeClass,


        Subject:

        currentSubject,


        Chapter:

        chapter,


        Teacher:

        document.getElementById(
            "teacherName"
        ).value.trim(),


        Video:

        document.getElementById(
            "videoLink"
        ).value.trim(),


        Notes:

        document.getElementById(
            "notesLink"
        ).value.trim(),


        Questions:

        document.getElementById(
            "questionsLink"
        ).value.trim(),


        Test:

        document.getElementById(
            "testLink"
        ).value.trim(),


        Status:

        editingChapter

        ?

        editingChapter.Status
        ||
        "published"

        :

        "published"

    };


    const action =

    editingChapter

    ?

    "update"

    :

    "add";


    const result =
    await apiRequest(
        action,
        item
    );


    if(result.success){

        closeChapterModal();


        await loadData();


        alert(
            "✅ Successfully saved!"
        );


    }else{

        alert(
            "❌ Error: "
            +
            result.message
        );

    }

}


/* =====================================================
   DELETE CHAPTER
===================================================== */

async function deleteChapter(id){

    if(!confirm(

        "क्या आप यह chapter delete करना चाहते हैं?"

    )){

        return;

    }


    const result =
    await apiRequest(

        "delete",

        {
            ID:id
        }

    );


    if(result.success){

        await loadData();

    }else{

        alert(
            "❌ "
            +
            result.message
        );

    }

}


/* =====================================================
   HIDE / PUBLISH
===================================================== */

async function toggleStatus(id){

    const item =
    allData.find(x =>

        String(x.ID)
        ===
        String(id)

    );


    if(!item){

        return;

    }


    item.Status =

    String(item.Status).toLowerCase()
    ===
    "hidden"

    ?

    "published"

    :

    "hidden";


    /*
     हमेशा safe Class code भेजें
    */

    item.Class =
    classToStorage(
        classFromStorage(
            item.Class
        )
    );


    const result =
    await apiRequest(

        "update",

        item

    );


    if(result.success){

        await loadData();

    }else{

        alert(
            "❌ "
            +
            result.message
        );

    }

}


/* =====================================================
   API REQUEST
===================================================== */

async function apiRequest(
    action,
    data
){

    try{

        /*
         Data की copy बनाकर
         Class को safe format में भेजना
        */

        const safeData = {

            ...data,

            Class:
            classToStorage(
                classFromStorage(
                    data.Class ||
                    selectedClass
                )
            )

        };


        const response =
        await fetch(

            API_URL,

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "text/plain;charset=utf-8"

                },

                body:
                JSON.stringify({

                    action:
                    action,

                    data:
                    safeData

                })

            }

        );


        return await response.json();


    }catch(error){

        return {

            success:false,

            message:
            error.toString()

        };

    }

}


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHtml(text){

    return String(
        text ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttr(text){

    return String(
        text ?? ""
    )

    .replace(
        /\\/g,
        "\\\\"
    )

    .replace(
        /'/g,
        "\\'"
    )

    .replace(
        /"/g,
        "&quot;"
    );

}


/* =====================================================
   START
===================================================== */

selectClass("6-8");

loadData();

</script>

</body>
</html>
